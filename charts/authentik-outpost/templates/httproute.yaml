{{- if .Values.gatewayApi.enabled }}
{{- if empty .Values.gatewayApi.parentRefs }}
{{- fail "gatewayApi.parentRefs cannot be empty when gatewayApi is enabled" }}
{{- end }}
{{- if empty .Values.gatewayApi.host }}
{{- fail "gatewayApi.host cannot be empty when gatewayApi is enabled" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  {{- if or .Values.gatewayApi.annotations .Values.gatewayApi.commonAnnotations }}
  {{- $annotations := merge .Values.gatewayApi.annotations .Values.gatewayApi.commonAnnotations }}
  annotations: {{ toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.gatewayApi.host | quote }}
    {{- range .Values.gatewayApi.extraHosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      {{- if .Values.gatewayApi.filters }}
      filters:
        {{- toYaml .Values.gatewayApi.filters | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "common.names.fullname" . }}
          {{- $httpPort := "" }}
          {{- range .Values.ports }}
          {{- if eq .name "http" }}
          {{- $httpPort = .servicePort }}
          {{- end }}
          {{- end }}
          {{- if not $httpPort }}
          {{- fail "gatewayApi.enabled requires a \"http\" entry in .Values.ports (Gateway API needs a numeric service port)" }}
          {{- end }}
          port: {{ $httpPort }}
{{- end }}
