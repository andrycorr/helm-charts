# -- Override the name of the chart.
nameOverride: ""
# -- Override the full name of the release.
fullnameOverride: ""

# -- Number of outpost pods to deploy.
replicaCount: 1

# -- Type of outpost: proxy, ldap, radius. Used as container name.
outpostType: proxy

# -- Deployment rollout settings.
progressDeadlineSeconds: 1200

image:
  # -- Base container image repository. The outpost type is appended
  # automatically (e.g. "ghcr.io/goauthentik/proxy" or ".../ldap").
  repository: "ghcr.io/goauthentik"
  # -- The image pull policy.
  pullPolicy: IfNotPresent
  # -- The container image tag. Overrides the chart's appVersion if set.
  tag: ""

authentik:
  # -- The full external URL of the Authentik core server (e.g., "https://auth.domain1.com").
  # This value is required.
  host: ""
  # -- The API token for the outpost, generated from the Authentik UI.
  # This value is required.
  token: ""
  # -- If true, disables TLS certificate verification for the connection to Authentik.
  # Should only be used for testing or with self-signed certificates.
  insecure: false
  # -- Use an existing secret instead of creating one.
  # Secret must contain AUTHENTIK_HOST, AUTHENTIK_TOKEN, AUTHENTIK_INSECURE keys.
  existingSecretName: ""

service:
  # -- The type of Kubernetes service to create for the outpost.
  type: ClusterIP
  # -- IP ranges allowed to access the Service (relevant only when type: LoadBalancer).
  loadBalancerSourceRanges: []
 
# -- Container ports, exposed both on the pod and on the Service.
# For a proxy outpost the defaults below are correct as-is.
# For an LDAP outpost, replace with e.g.:
#   - name: ldap
#     containerPort: 3389
#     servicePort: 389
#     protocol: TCP
#   - name: ldaps
#     containerPort: 6636
#     servicePort: 636
#     protocol: TCP
ports:
  - name: http
    containerPort: 9000
    servicePort: 9000
    protocol: TCP
  - name: https
    containerPort: 9443
    servicePort: 9443
    protocol: TCP

# -- Startup probe configuration for the outpost pod. Leave empty ({}) to disable.
# No default is set — pick one of the examples below (or your own) explicitly,
# since Helm deep-merges maps and a preset httpGet/tcpSocket here would collide
# with whatever handler an overriding values file sets.
startupProbe: {}
# -- Example for a proxy outpost (exposes /ping over http):
#  httpGet:
#    path: /outpost.goauthentik.io/ping
#    port: http
#  initialDelaySeconds: 10
#  periodSeconds: 10
# -- Example for an LDAP outpost (no HTTP /ping endpoint):
#  tcpSocket:
#    port: ldap
#  periodSeconds: 10
#  failureThreshold: 120
 
# -- Liveness probe configuration for the outpost pod. Leave empty ({}) to disable.
# No default is set — see startupProbe above for why, and pick an example below.
livenessProbe: {}
# -- Example for a proxy outpost (exposes /ping over http):
#  httpGet:
#    path: /outpost.goauthentik.io/ping
#    port: http
#  initialDelaySeconds: 10
#  periodSeconds: 10
# -- Example for an LDAP outpost (no HTTP /ping endpoint):
#  tcpSocket:
#    port: ldap
#  periodSeconds: 10
#  timeoutSeconds: 3
#  failureThreshold: 3
 
# -- Readiness probe configuration for the outpost pod. Leave empty ({}) to disable.
# No default is set — see startupProbe above for why, and pick an example below.
readinessProbe: {}
# -- Example for a proxy outpost (exposes /ping over http):
#  httpGet:
#    path: /outpost.goauthentik.io/ping
#    port: http
#  initialDelaySeconds: 10
#  periodSeconds: 10
# -- Example for an LDAP outpost (no HTTP /ping endpoint):
#  tcpSocket:
#    port: ldap
#  periodSeconds: 30
#  timeoutSeconds: 3
#  failureThreshold: 5

# -- Resource requests and limits for the outpost pod.
# It is recommended to adjust these values based on observed performance.
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# -- Node selector for pod assignment.
nodeSelector: {}

# -- Tolerations for pod assignment.
tolerations: []

# -- Affinity rules for pod assignment.
affinity: {}

ingress:
# -- Enable ingress for the outpost
  enabled: false

# -- Primary hostname for the outpost (e.g. outpost.domain.com)
  host: ""

# -- IP ranges allowed to access the outpost endpoint
  whitelistSourceRange: []

# -- Additional ingress annotations
  annotations: {}

# -- List of additional hostnames for applications protected by this outpost
# Each application's domain must be added here so nginx can route auth requests correctly
  extraHosts: []
#     - app1.domain.com
#     - app2.domain.com

# -- TLS configuration for the ingress
# Example:
  tls: []
#   tls:
#   - secretName: my-tls-secret
#     hosts:
#       - outpost.domain.com

gatewayApi:
# -- Enable an HTTPRoute (gateway.networking.k8s.io/v1) for the outpost
  enabled: false

# -- List of Gateway API parentRefs the HTTPRoute should attach to. Required when gatewayApi.enabled is true.
# Example:
#   parentRefs:
#   - name: my-gateway
#     namespace: gateway-system
#     sectionName: https
  parentRefs: []

# -- Primary hostname for the outpost (e.g. outpost.domain.com)
  host: ""

# -- List of additional hostnames for applications protected by this outpost
# Each application's domain must be added here so the route matches auth requests correctly
  extraHosts: []
#     - app1.domain.com
#     - app2.domain.com

# -- Additional filters for the HTTPRoute rule (e.g. request header modifiers)
  filters: []

# -- Additional annotations for the HTTPRoute
  annotations: {}

# -- Additional common annotations for the HTTPRoute (merged with annotations)
  commonAnnotations: {}